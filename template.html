<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LAN party - воткнись в сеть</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔌</text></svg>">
    <link href="./style.css" rel="stylesheet">
</head>
<body>
    <div class="chat-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    🔌
                    <h2>LAN Party - воткнись в сеть</h2>
                </div>
                <div class="online-count">
                    <span class="dot"></span>
                    <span id="onlineCount">0 пользователей онлайн</span>
                </div>
            </div>
            <div class="sidebar-nav">
                <button class="chat-nav-item active" id="publicChatBtn" title="Общий чат">
                    <span class="chat-nav-icon">📢</span>
                    <span>Общий чат</span>
                </button>
                <button class="chat-nav-item" id="selfChatBtn" title="Личные заметки — видны только вам">
                    <span class="chat-nav-icon">📝</span>
                    <span>Мои заметки</span>
                </button>
            </div>
            <div class="sidebar-section">
                <div class="section-title">Личные сообщения</div>
                <div class="dm-list" id="dmList"></div>
            </div>
            <div class="sidebar-section users-section">
                <div class="section-title">Пользователи</div>
                <div class="users-list" id="usersList"></div>
            </div>
        </div>

        <!-- Main Chat -->
        <div class="main-chat">
            <div class="chat-header">
                <div class="header-left">
                    <div class="room-info">
                        <div class="room-avatar" id="roomAvatar">📢</div>
                        <div class="room-text">
                            <span class="room-name" id="roomName">Общий чат</span>
                            <span class="room-status" id="chatInfo"></span>
                        </div>
                    </div>
                </div>
                <div class="header-actions">
                    <div class="current-user" id="currentUserBadge" style="display:none;"
                         title="Ваша учётная запись">
                        <span class="current-user-avatar" id="currentUserAvatar"></span>
                        <span class="current-user-name" id="currentUserName"></span>
                        <span class="current-user-you">вы</span>
                    </div>
                    <button class="clear-history-btn" id="clearHistoryBtn" style="display:none;"
                            title="Очистить историю этого чата">
                        🧹
                        <span>Очистить</span>
                    </button>
                    <button class="logout-btn" id="logoutBtn" style="display:none;">
                        🚪
                        <span>Выйти</span>
                    </button>
                </div>
            </div>

            <!-- Auth (только вход; регистрация через admin_tool.py) -->
            <div class="username-container" id="usernameContainer">
                <label for="usernameInput">👤</label>
                <input type="text" id="usernameInput" placeholder="Имя..." maxlength="20" autocomplete="username">
                <input type="password" id="passwordInput" placeholder="Пароль..." maxlength="128" autocomplete="current-password">
                <button id="loginBtn" title="Войти">➡️ Войти</button>
            </div>

            <!-- Messages -->
            <div class="chat-messages" id="chatMessages"></div>

            <!-- Chat Input -->
            <div class="chat-input" id="chatInput">
                <div class="reply-indicator" id="replyIndicator">
                    <span>↩️ Ответ на <span class="reply-author" id="replyAuthor"></span>:</span>
                    <span class="reply-text" id="replyText"></span>
                    <button class="reply-cancel" id="replyCancelBtn">✕</button>
                </div>

                <div class="input-row">
                    <div class="input-wrapper" id="inputWrapper">
                        <div class="input-textarea-wrapper">
                            <textarea id="messageInput" placeholder="Опишите ваш вопрос или проблему..." disabled rows="2"></textarea>
                        </div>
                        <div class="attachment-preview-container" id="attachmentPreviewContainer"></div>
                        <div class="input-tools">
                            <button class="emoji-btn" id="emojiBtn" title="Смайлы">😊</button>
                            <button class="file-btn" id="fileBtn" title="Прикрепить файл">📎</button>
                            <input type="file" id="fileInput" multiple style="display:none">
                            <span class="char-count" id="charCount">0</span>
                        </div>
                    </div>
                    <div class="action-buttons">
                        <button class="edit-cancel" id="cancelEditBtn">✖ Отмена</button>
                        <button class="send-btn" id="sendBtn" disabled>🚀 Отправить</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Emoji Picker -->
    <div class="emoji-picker-container" id="emojiPicker">
        <div class="emoji-grid" id="emojiGrid"></div>
    </div>

    <!-- Image Modal -->
    <div class="image-modal" id="imageModal">
        <img id="modalImage" src="" alt="Просмотр изображения">
    </div>

    <!-- Notification Container -->
    <div class="notification-container" id="notificationContainer"></div>

    <script src="./main.js"></script>
</body>
</html>
