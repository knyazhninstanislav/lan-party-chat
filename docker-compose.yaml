services:
  lan-party:
    build: .
    container_name: lan-party
    ports:
      - "5000:5000"
    volumes:
      - lan-party-data:/app/data
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - DB_PATH=/app/data/chat.db
      # При работе за nginx (рекомендуется для прода):
      # - TRUST_PROXY=1
      # - COOKIE_SECURE=1
    restart: unless-stopped

volumes:
  lan-party-data: